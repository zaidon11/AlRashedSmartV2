<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الزبون - AlRashed Smart V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;">← العودة للرئيسية</a>
        <h2>تفاصيل الزبون</h2>
    </header>

    <!-- بيانات الزبون الأساسية -->
    <section class="card" id="customerDetails">
        <h3 id="cName">جاري التحميل...</h3>
        <p id="cInfo" style="color: var(--text-secondary); margin-top: 6px;"></p>
        
        <div class="grid-stats" style="margin-top: 16px;">
            <div class="stat-item">
                <div>إجمالي المبلغ</div>
                <div class="stat-value" id="cTotal">0</div>
            </div>
            <div class="stat-item">
                <div>المدفوع</div>
                <div class="stat-value" id="cPaid" style="color: var(--status-paid);">0</div>
            </div>
            <div class="stat-item">
                <div>المتبقي</div>
                <div class="stat-value" id="cRemaining" style="color: var(--status-unpaid);">0</div>
            </div>
        </div>
    </section>

    <!-- الدفع التلقائي السريع -->
    <section class="card">
        <h3>تسديد دفع تلقائي (تسلسلي)</h3>
        <form id="autoPaymentForm" style="display: flex; gap: 8px; margin-top: 12px;">
            <input type="number" id="autoPayAmount" placeholder="أدخل مبلغ التسديد" required style="margin: 0;">
            <button type="submit" style="width: 160px;">تسديد تلقائي</button>
        </form>
    </section>

    <!-- جدول الأقساط الشهرية -->
    <section class="card">
        <h3>جدول الأقساط الشهرية</h3>
        <div id="monthsContainer" style="margin-top: 12px;"></div>
    </section>

    <script type="module" src="js/customers.js"></script>
    <script type="module" src="js/payments.js"></script>
    <script type="module">
        import { db, ref, get, ROOT_NODE } from "./js/firebase.js";
        import { processManualPayment, processAutoPayment } from "./js/payments.js";

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');

        async function loadCustomer() {
            if (!customerId) return;
            const snapshot = await get(ref(db, `${ROOT_NODE}/customers/${customerId}`));
            if (!snapshot.exists()) return;

            const c = snapshot.val();
            document.getElementById('cName').innerText = c.name;
            document.getElementById('cInfo').innerText = `هاتف: ${c.phone} | الجهاز: ${c.device} (${c.color}) | IMEI: ${c.imei}`;
            document.getElementById('cTotal').innerText = c.totalPrice.toLocaleString() + ' د.ع';
            
            const totalPaid = c.totalPrice - c.remaining;
            document.getElementById('cPaid').innerText = totalPaid.toLocaleString() + ' د.ع';
            document.getElementById('cRemaining').innerText = c.remaining.toLocaleString() + ' د.ع';

            // عرض الأشهر
            const container = document.getElementById('monthsContainer');
            container.innerHTML = '';

            c.months.forEach((m, idx) => {
                const monthCard = document.createElement('div');
                monthCard.className = 'card';
                monthCard.style.borderRight = `6px solid ${m.status === 'Paid' ? 'var(--status-paid)' : (m.status === 'Partial' ? 'var(--status-partial)' : 'var(--status-unpaid)')}`;
                
                monthCard.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong>الشهر ${m.monthNumber} (تاريخ الاستحقاق: ${m.dueDate})</strong>
                        <span class="badge badge-${m.status.toLowerCase()}">${m.status}</span>
                    </div>
                    <div style="margin-top: 8px; color: var(--text-secondary); font-size: 0.9rem;">
                        المطلوب: ${m.required.toLocaleString()} | المدفوع: ${m.paid.toLocaleString()} | المتبقي: ${m.remaining.toLocaleString()}
                    </div>
                    ${m.status !== 'Paid' ? `
                        <div style="display: flex; gap: 8px; margin-top: 10px;">
                            <input type="number" id="payInput_${idx}" placeholder="مبلغ الدفع اليدوي" style="margin:0;">
                            <button onclick="window.payManual(${idx})" style="width: 120px;">دفع يدوي</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(monthCard);
            });
        }

        window.payManual = async (index) => {
            const amount = document.getElementById(`payInput_${index}`).value;
            if (!amount) return alert('أدخل المبلغ');
            const res = await processManualPayment(customerId, index, amount);
            if (res.success) {
                alert('تم تسجيل الدفعة بنجاح');
                window.location.href = `receipt.html?id=${customerId}&rec=${res.receipt.receiptNumber}`;
            } else {
                alert(res.message);
            }
        };

        document.getElementById('autoPaymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('autoPayAmount').value;
            const res = await processAutoPayment(customerId, amount);
            if (res.success) {
                alert('تم التسديد التلقائي بنجاح');
                window.location.href = `receipt.html?id=${customerId}&rec=${res.receipt.receiptNumber}`;
            } else {
                alert(res.message);
            }
        });

        loadCustomer();
    </script>
</body>
</html>
