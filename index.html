<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlRashed Smart V2</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="topHeader">

<div>

<h1>📱 مركز الراشد</h1>

<p>Smart Installments V2</p>

</div>


<button id="addCustomerBtn">

+ إضافة زبون

</button>


</header>




<section class="dashboard">


<div class="statCard">

<h2 id="customersCount">0</h2>

<p>عدد الزبائن</p>

</div>



<div class="statCard">

<h2 id="totalRemaining">0</h2>

<p>المتبقي</p>

</div>



<div class="statCard">

<h2 id="paidMoney">0</h2>

<p>المقبوض</p>

</div>



</section>





<section class="searchBox">


<input

id="searchInput"

placeholder="بحث عن زبون..."

>


</section>





<section id="customersList">


</section>





<div id="customerModal" class="modal">


<div class="modalBox">


<h2>

إضافة زبون

</h2>



<input id="name" placeholder="اسم الزبون">


<input id="phone" placeholder="رقم الهاتف">


<input id="device" placeholder="نوع الجهاز">


<input id="totalPrice" type="number" placeholder="السعر الكلي">


<input id="firstPayment" type="number" placeholder="الدفعة الأولى">


<input id="monthly" type="number" placeholder="القسط الشهري">


<input id="payDay" type="number" placeholder="يوم الدفع">



<button id="saveCustomer">

حفظ

</button>



<button id="closeModal">

إلغاء

</button>



</div>


</div>





<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>



<script src="js/firebase.js"></script>

<script src="js/database.js"></script>

<script src="js/customers.js"></script>

<script src="js/payments.js"></script>

<script src="js/app.js"></script>


</body>

</html>
