<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlRashed Smart V2 - إدارة الأقساط</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.25rem;">AlRashed Smart V2</h2>
        <button id="themeToggle" style="width: auto; padding: 6px 14px;">تغيير المظهر</button>
    </header>

    <section class="card">
        <h3 style="margin-bottom: 8px;">لوحة التحكم</h3>
        <div class="grid-stats">
            <div class="stat-item">
                <div>إجمالي الزبائن</div>
                <div class="stat-value" id="statTotalCustomers">0</div>
            </div>
            <div class="stat-item">
                <div>إجمالي المتبقي</div>
                <div class="stat-value" id="statTotalRemaining">0 د.ع</div>
            </div>
            <div class="stat-item">
                <div>إجمالي المقبوض</div>
                <div class="stat-value" id="statTotalCollected">0 د.ع</div>
            </div>
            <div class="stat-item">
                <div>المتأخرين</div>
                <div class="stat-value" id="statOverdueCount" style="color: var(--status-unpaid);">0</div>
            </div>
        </div>
    </section>

    <section class="card">
        <h3>إضافة زبون جديد</h3>
        <form id="addCustomerForm" style="margin-top: 10px;">
            <input type="text" id="custName" placeholder="اسم الزبون الكامل" required>
            <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
            <input type="text" id="custDevice" placeholder="نوع الجهاز (مثال: iPhone 12 Pro Max)" required>
            <input type="text" id="custImei" placeholder="رقم IMEI" required>
            <input type="text" id="custColor" placeholder="لون الجهاز" required>
            <input type="number" id="custTotalPrice" placeholder="السعر الكلي (د.ع)" required>
            <input type="number" id="custDownPayment" placeholder="الدفعة الأولى (د.ع)" required>
            <input type="number" id="custMonthly" placeholder="القسط الشهري (د.ع)" required>
            <input type="number" id="custPayDay" placeholder="يوم الاستحقاق الشهري (1-31)" min="1" max="31" required>
            <input type="date" id="custPurchaseDate" required>
            <input type="text" id="custNotes" placeholder="ملاحظات (اختياري)">
            <button type="submit" style="margin-top: 6px;">حفظ الزبون وإنشاء الأقساط</button>
        </form>
    </section>

    <section class="card">
        <h3>قائمة الزبائن والبحث</h3>
        <input type="text" id="searchInput" placeholder="بحث لحظي بالاسم، رقم الهاتف، أو الـ IMEI...">
        <div id="customersList"></div>
    </section>

    <section class="card">
        <h3>أدوات النظام</h3>
        <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
            <button id="exportBtn" style="flex: 1;">تصدير JSON</button>
            <button id="importBtn" style="flex: 1;">استيراد JSON</button>
            <button id="migrateBtn" style="flex: 1; background-color: #8b5cf6;">نقل البيانات القديمة</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
