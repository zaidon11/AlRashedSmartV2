<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlRashed Smart V2 (Beta)</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="top-bar">
    <h1>📱 مركز الراشد</h1>
    <p>AlRashed Smart Installments V2 (Beta)</p>
</header>

<main class="container">

    <section class="card">
        <h2>إحصائيات</h2>

        <div class="stats">

            <div class="stat-box">
                <span id="customersCount">0</span>
                <small>عدد الزبائن</small>
            </div>

            <div class="stat-box">
                <span id="lateCustomers">0</span>
                <small>المتأخرين</small>
            </div>

            <div class="stat-box">
                <span id="totalRemaining">0</span>
                <small>المتبقي</small>
            </div>

        </div>

    </section>

    <section class="card">

        <input
            id="searchInput"
            type="text"
            placeholder="🔍 ابحث عن زبون">

        <button id="addCustomerBtn">
            ➕ إضافة زبون
        </button>

    </section>

    <section class="card">

        <h2>الزبائن</h2>

        <div id="customersList">

            جاري تحميل البيانات...

        </div>

    </section>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Project Files -->

<script src="js/firebase.js"></script>

<script src="js/helpers.js"></script>

<script src="js/ui.js"></script>

<script src="js/customers.js"></script>

<script src="js/months.js"></script>

<script src="js/payments.js"></script>

<script src="js/migration.js"></script>

<script src="js/app.js"></script>

</body>

</html>
