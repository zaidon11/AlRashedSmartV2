<!-- receipt.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيصال قبض - مركز الراشد</title>
    <style>
        body { font-family: sans-serif; direction: rtl; padding: 20px; max-width: 400px; margin: 0 auto; border: 1px solid #ccc; }
        .center { text-align: center; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        @media print { button { display: none; } }
    </style>
</head>
<body>
    <div class="center">
        <h2>مركز الراشد لبيع الأجهزة</h2>
        <p>إيصال استلام قسط</p>
        <hr>
    </div>
    
    <div class="row"><span>رقم الإيصال:</span><strong id="rNum"></strong></div>
    <div class="row"><span>اسم الزبون:</span><strong id="rName"></strong></div>
    <div class="row"><span>الجهاز:</span><span id="rDevice"></span></div>
    <div class="row"><span>المبلغ المدفوع:</span><strong id="rAmount"></strong></div>
    <div class="row"><span>نوع الدفع:</span><span id="rType"></span></div>
    <div class="row"><span>التاريخ:</span><span id="rDate"></span></div>
    
    <hr>
    <div class="center" style="margin-top: 15px;">
        <canvas id="qrcode"></canvas>
        <br><br>
        <button onclick="window.print()" style="padding: 10px 20px; cursor: pointer;">طباعة الإيصال</button>
    </div>

    <!-- مكتبة QR Code خفيفة ومجانية من CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script type="module" src="js/receipt.js"></script>
</body>
</html>
