<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيصال قبض - مركز الراشد</title>
    <style>
        body { font-family: sans-serif; direction: rtl; padding: 20px; max-width: 380px; margin: 20px auto; border: 1px dashed #475569; border-radius: 8px; }
        .center { text-align: center; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        hr { border: none; border-top: 1px dashed #ccc; margin: 12px 0; }
        @media print { button { display: none; } body { border: none; } }
    </style>
</head>
<body>
    <div class="center">
        <h2 style="margin-bottom: 4px;">مركز الراشد لبيع الأجهزة</h2>
        <p style="font-size: 0.85rem; color: #555;">إيصال تسليم قسط</p>
        <hr>
    </div>
    
    <div class="row"><span>رقم الإيصال:</span><strong id="rNum">---</strong></div>
    <div class="row"><span>اسم الزبون:</span><strong id="rName">---</strong></div>
    <div class="row"><span>الجهاز:</span><span id="rDevice">---</span></div>
    <div class="row"><span>المبلغ المدفوع:</span><strong id="rAmount">---</strong></div>
    <div class="row"><span>نوع الدفع:</span><span id="rType">---</span></div>
    <div class="row"><span>التاريخ:</span><span id="rDate">---</span></div>
    
    <hr>
    <div class="center">
        <canvas id="qrcode"></canvas>
        <br><br>
        <button onclick="window.print()" style="padding: 10px 24px; cursor: pointer; font-weight: bold;">طباعة الإيصال</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script type="module" src="js/receipt.js"></script>
</body>
</html>
